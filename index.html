<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REEL RUSH — Monster Fishing</title>
<link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#04121c" />
  <link rel="icon" href="pwa/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="pwa/icon-192.png" />
<link rel="icon" href="pwa/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div id="hud-tl">
        <div class="coin-pill"><span class="coin-icon"></span><span id="coinNum">0</span></div>
        <div class="stat-pill" id="comboPill" hidden><span id="comboNum">x1</span><span class="dim">COMBO</span></div>
      </div>
      <div id="hud-tr">
        <div class="icon-btn" id="timeIcon" data-i18n-title="ui.titleTime" title="시간대"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></div>
        <div class="icon-btn" id="zoneIcon" data-i18n-title="ui.titleZone" title="어장">📍<span id="zoneName">부둣가</span></div>
        <div class="icon-btn" id="musicBtn" title="Music / 음악"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="16" r="2.2"/></svg></div>
        <div class="icon-btn" id="localeBtn" title="Language / 언어"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg><span id="localeLabel">KO</span></div>
        <div class="icon-btn" id="muteBtn" data-i18n-title="ui.titleMute" title="소리"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></div>
      </div>
      <div id="hud-bl">
        <div id="zoneChips"></div>
      </div>
      <div id="hud-br">
        <button class="pill-btn" id="btnQuests"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M8.5 10h7M8.5 14h7M8.5 18h4"/></svg><span data-i18n="ui.tabQuests">퀘스트</span></button>
        <button class="pill-btn" id="btnLog"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M8 8h7M8 12h7M8 16h4"/></svg><span data-i18n="ui.tabLog">도감</span></button>
        <button class="pill-btn" id="btnShop"><svg viewBox="0 0 24 24"><path d="M4 6h2l2.2 10h9.6L20 8H7"/><circle cx="10" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg><span data-i18n="ui.tabShop">상점</span> <span id="coolerBadge" hidden>0</span></button>
      </div>
      <div id="hint" class="hint"></div>
    </div>

    <!-- Shop -->
    <div class="panel" id="shopPanel" hidden>
      <div class="panel-head"><h2><span data-i18n="ui.panelShop">낚시 상점</span></h2><button class="close-btn" data-close="shopPanel">✕</button></div>
      <div class="panel-body">
        <div class="shop-tabs">
          <button class="tab active" data-tab="upgrades" data-i18n="ui.tabUpgrades">업그레이드</button>
          <button class="tab" data-tab="cooler"><span data-i18n="ui.tabCooler">어획물</span> <span id="coolerCount" class="mini-badge">0</span></button>
        </div>
        <div id="tab-upgrades" class="tab-body"></div>
        <div id="tab-cooler" class="tab-body" hidden>
          <div id="coolerList" class="cooler-list"></div>
          <button class="big-btn" id="sellAllBtn">전체 판매하기</button>
        </div>
      </div>
    </div>

    <!-- Collection log -->
    <div class="panel" id="logPanel" hidden>
      <div class="panel-head"><h2><span data-i18n="ui.panelLog">어족도감</span></h2><button class="close-btn" data-close="logPanel">✕</button></div>
      <div class="panel-body">
        <div id="logProgress" class="log-progress"></div>
        <div id="logGrid" class="log-grid"></div>
      </div>
    </div>

    <!-- Quests & achievements -->
    <div class="panel" id="questsPanel" hidden>
      <div class="panel-head"><h2><span data-i18n="ui.panelQuests">퀘스트</span></h2><button class="close-btn" data-close="questsPanel">✕</button></div>
      <div class="panel-body">
        <div class="shop-tabs">
          <button class="tab active" data-qtab="daily"><span data-i18n="ui.tabDaily">일일 퀘스트</span></button>
          <button class="tab" data-qtab="achievements"><span data-i18n="ui.tabAch">업적</span></button>
        </div>
        <div id="qtab-daily"></div>
        <div id="qtab-achievements" hidden></div>
      </div>
    </div>

    <!-- Toasts -->
    <div id="toasts"></div>

    <!-- Intro -->
    <div id="intro">
      <h1>REEL&nbsp;RUSH</h1>
      <p class="sub"><span data-i18n="intro.title">몬스터 피싱 아케이드</span></p>
      <p class="howto"><span data-i18n="intro.howto1">클릭으로 캐스트 → "!"가 뜨면 클릭으로 후킹 →</span><br/><span data-i18n="intro.howto2">긴장 게이지를 초록 밴드에 유지하며 릴링!</span></p>
      <button id="startBtn" class="big-btn" data-i18n="intro.start">출항하기</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
