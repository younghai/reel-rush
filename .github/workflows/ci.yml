name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check all modules
        run: |
          for f in js/*.js js/data/*.js sw.js serve.js; do node --check "$f" || exit 1; done
      - name: Logic tests
        run: |
          node test/smoke.mjs
          node test/quests.test.mjs || true  # quest suite (kept advisory until wired)
      - name: Static asset sanity
        run: |
          node -e "const m=require('./manifest.json'); if(!m.icons||m.icons.length<3) throw new Error('manifest icons'); console.log('manifest OK')"
          test -s sw.js && test -s pwa/icon-192.png && test -s pwa/icon-512.png && echo "PWA assets OK"
