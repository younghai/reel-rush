<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="REEL RUSH">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04121c"/>
      <stop offset="1" stop-color="#14486e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="80" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f2a93b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sea)"/>
  <circle cx="256" cy="236" r="200" fill="#7fd4ff" opacity="0.06"/>

  <!-- stylized fish arcing over the hook -->
  <g transform="rotate(-12 252 195)" fill="#dff3ff">
    <ellipse cx="252" cy="195" rx="60" ry="28"/>
    <path d="M312 195 L356 170 L356 220 Z"/>
    <circle cx="216" cy="187" r="6" fill="#04121c"/>
  </g>

  <!-- golden fishing hook -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M178 150 V284 a78 78 0 0 0 156 0 V238" stroke-width="26"/>
    <circle cx="178" cy="106" r="18" stroke-width="14"/>
  </g>

  <!-- subtle wave arcs -->
  <g fill="none" stroke="#7fd4ff" stroke-linecap="round">
    <path d="M-16 436 q64 -34 128 0 t128 0 t128 0 t128 0 t128 0" stroke-width="12" opacity="0.22"/>
    <path d="M-80 468 q64 -30 128 0 t128 0 t128 0 t128 0 t128 0" stroke-width="10" opacity="0.13"/>
  </g>
</svg>
